name: Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"
  push:
    branches:
      - main

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg

          # Uniquement le calendrier de contributions (style heatmap) —
          # pas de header, followers, stars ni langages.
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
